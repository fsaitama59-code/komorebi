# Project-wide Gradle settings
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects.
org.gradle.parallel=true

# Kotlin Gradle plugin options
kotlin.code.style=official

# AndroidX
android.enableJetifier=true
android.useAndroidX=true

# Build cache
org.gradle.caching=true

# Configure on demand
org.gradle.configureondemand=true

# JVM args for Kotlin daemon
kotlin.daemon.jvm.options=-Xmx2048m

# R8 / ProGuard
android.r8.fullMode=true

# Namespace
android.nonTransitiveRClass=true

# Compose Compiler
compose.compiler.version=2.0.0

# Version catalog (optional - for centralized version management)
# Version variables can be defined here and used in build.gradle.kts
komorebi_version=1.0.0
komorebi_version_code=1

# Min/Target SDK
min_sdk=26
target_sdk=35
compile_sdk=35

# Dependencies versions
kotlin_version=2.0.20
compose_bom_version=2024.10.00
coroutines_version=1.8.1
lifecycle_version=2.8.2
room_version=2.6.1
hilt_version=2.51.1
navigation_version=2.8.2
coil_version=2.7.0
datastore_version=1.1.1
work_version=2.9.0
media3_version=1.4.1
accompanist_version=0.32.0
serialization_version=1.6.3
ksp_version=2.0.20-1.0.14